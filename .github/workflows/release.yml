# Builds the Zero Windows desktop app and publishes it to the public Vercel Blob
# "update feed" that the app's electron-updater polls. Triggered ONLY when you push
# a version tag, e.g.:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The installed Surface app checks the feed on launch, downloads any newer version in
# the background, and applies it on the next restart. Data is never touched (the app
# stays on the app://local origin regardless of version).
#
# Required repo config (Settings → Secrets and variables → Actions):
#   • Secret   BLOB_READ_WRITE_TOKEN  – write token for the PUBLIC Blob store
#     (the feed URL itself is public + hardcoded in package.json / upload-release.mjs)
name: release-desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Only ONE release build may run at a time. The feed (latest.yml + installer) is a single
# shared Blob folder that each run prunes-then-writes; two overlapping runs can interleave a
# prune with the other's put and corrupt/empty the feed. A mass tag push (e.g. the v0.2.NNN
# re-versioning, which fired ~145 builds) would otherwise stampede it. Serialize on the workflow
# so builds queue instead of racing; do NOT cancel-in-progress (a half-finished upload left the
# feed mid-write is worse than waiting).
concurrency:
  group: release-desktop
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # The WebView2 resource host (native/resource-host) is published to a self-contained
      # .exe by scripts/build-resource-host.mjs during electron:build:ci, then bundled via
      # electron-builder extraResources. Pin the SDK so the publish is reproducible.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Releasing version $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        run: pnpm electron:build:ci

      - name: Upload update feed to Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: pnpm release:upload
